<div class="view-mode-toolbar" id="view-mode-toolbar">
  <div class="toolbar-sort-wrap">
    <select id="sort-select" class="sort-select" aria-label="Sort publications">
      <option value="latest">Latest First</option>
      <option value="oldest">Oldest First</option>
      <option value="title">Title (A-Z)</option>
    </select>
  </div>
  <div class="toolbar-view-toggle">
    <button type="button" class="view-btn view-cards active" id="btn-view-cards" title="Cards View" aria-label="Cards View">
      <span class="view-icon">▦</span> Cards
    </button>
    <button type="button" class="view-btn view-compact" id="btn-view-compact" title="Compact Ledger View" aria-label="Compact Ledger View">
      <span class="view-icon">≡</span> Compact
    </button>
  </div>
</div>
